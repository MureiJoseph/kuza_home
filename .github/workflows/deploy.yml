name: Deploy to Truehost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /home/chlojjrp/public_html/
          protocol: ftps
```

Then scroll down → **Commit changes** → **Commit directly to main** → **Commit changes**

---

Also make sure you updated `FTP_USERNAME` secret to:
